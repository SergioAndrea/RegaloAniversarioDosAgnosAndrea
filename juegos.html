<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juegos</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="starfield" aria-hidden="true"></div>

  <div class="wrap">
    <h1 class="eyebrow-free-title">Antes de seguir, dos preguntas</h1>
    <p class="lead">Sí, hay trampa. No, no puedes evitarlo.</p>

    <!-- JUEGO 1: botón que huye -->
    <section class="zona-juego">
      <h2 id="mensaje-pregunta">¿Quieres aguantarme dos años más?</h2>
      <div class="zona-boton" id="zona-boton">
        <button class="btn" id="btn-si">Sí</button>
        <button class="btn btn-ghost" id="btn-no">No</button>
      </div>
    </section>

    <!-- JUEGO 2: memoria -->
    <section class="zona-juego">
      <h2>Encuentra las parejas</h2>
      <p class="lead" style="margin-bottom:0;">
        Parejas encontradas: <span id="contador-memoria">0 / 4</span>
      </p>
      <div class="tablero-memoria" id="tablero-memoria" role="group" aria-label="Juego de memoria"></div>
      <p class="lead memoria-final" id="memoria-final" style="margin:0;">
        <!-- Sergio: cambia este texto final si quieres -->
        Lo has conseguido. Como siempre conmigo, ¿no? Sigamos.
      </p>
    </section>

    <div style="text-align:center;">
      <a class="btn" href="galeria.html">Ver la galería</a>
    </div>
  </div>

  <nav class="nav">
    <a href="index.html">Inicio</a>
    <a href="historia.html">Historia</a>
    <a href="juegos.html" class="active">Juegos</a>
    <a href="galeria.html">Galería</a>
  </nav>

<script src="js/main.js"></script>
